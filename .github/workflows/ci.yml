name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Run Tests (Vitest)
        run: npm test

      - name: Run Linter (ESLint)
        run: npm run lint

      - name: Build Website Widget
        run: npm run build:widget

      - name: Build Next.js Application
        run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/quickqr?schema=public"
          APP_SECRET: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          NEXT_PUBLIC_APP_URL: "https://quickqr.amanxthink11.com"
          NEXT_PUBLIC_QR_BASE_URL: "https://quickqr.amanxthink11.com"
          NODE_ENV: "production"
